<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="description" content="Detalle de producto, stock y disponibilidad en Raíz & Hoja.">
  <meta name="theme-color" content="#fafaf9">
  <title>Detalle del producto · Raíz & Hoja</title>
  <script>
    (function () {
      try {
        var guardado = localStorage.getItem('tienda_tema');
        var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (guardado === 'oscuro' || (!guardado && prefiereOscuro)) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Fraunces", ui-serif, Georgia, serif;
    }
  </style>
  <style>
    html { scroll-padding-top: 5.5rem; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animar-aparecer { animation: aparecer .45s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes latido { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); } }
    .animar-latido { animation: latido .5s ease-in-out; }
    @keyframes entrar-toast { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    .animar-toast { animation: entrar-toast .3s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .animar-aparecer, .animar-latido, .animar-toast { animation: none !important; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-stone-800 antialiased selection:bg-emerald-200 selection:text-emerald-950 dark:bg-stone-950 dark:text-stone-100">
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[70] focus:rounded-lg focus:bg-emerald-700 focus:px-4 focus:py-2 focus:text-white">Saltar al contenido</a>

  <div id="navbar"></div>

  <main id="contenido" class="flex-1">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
      <nav aria-label="Migas de pan" class="mb-6 flex flex-wrap items-center gap-2 text-sm text-stone-400 dark:text-stone-500">
        <a href="index.html" class="transition hover:text-emerald-700 dark:hover:text-emerald-300">Catálogo</a>
        <span aria-hidden="true">/</span>
        <span id="migaCategoria" class="text-stone-500 dark:text-stone-400">Producto</span>
        <span aria-hidden="true">/</span>
        <span id="migaNombre" class="max-w-[12rem] truncate font-medium text-stone-700 sm:max-w-xs dark:text-stone-200">Cargando…</span>
      </nav>

      <div id="detalleProducto" class="animar-aparecer">
        <!-- Skeleton inicial -->
        <div class="animate-pulse overflow-hidden rounded-3xl border border-stone-200/80 bg-white lg:grid lg:grid-cols-2 dark:border-stone-800 dark:bg-stone-900">
          <div class="h-72 bg-stone-200/80 sm:h-96 lg:h-full dark:bg-stone-800"></div>
          <div class="space-y-4 p-6 sm:p-8 lg:p-10">
            <div class="h-4 w-24 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            <div class="h-9 w-3/4 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            <div class="h-6 w-1/3 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            <div class="h-3 w-full rounded-full bg-stone-200/80 dark:bg-stone-800"></div>
            <div class="h-3 w-5/6 rounded-full bg-stone-200/80 dark:bg-stone-800"></div>
            <div class="h-24 w-full rounded-2xl bg-stone-200/70 dark:bg-stone-800"></div>
            <div class="h-11 w-full rounded-xl bg-stone-200 dark:bg-stone-800"></div>
          </div>
        </div>
      </div>

      <section id="seccionRelacionados" class="mt-16 hidden">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-emerald-700 dark:text-emerald-400">También te puede gustar</p>
            <h2 class="mt-2 font-display text-2xl font-semibold tracking-tight text-stone-900 sm:text-3xl dark:text-stone-50">De la misma categoría</h2>
          </div>
          <a id="enlaceCategoria" href="index.html#catalogo" class="text-sm font-semibold text-emerald-700 transition hover:text-emerald-800 dark:text-emerald-400">Ver categoría</a>
        </div>
        <div id="gridRelacionados" class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/favoritos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/common.js"></script>
  <script src="js/producto.js"></script>
</body>
</html>
