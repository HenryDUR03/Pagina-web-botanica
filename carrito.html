<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda de Plantas</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div id="navbar"></div>
    
    <!-- Contenido Principal -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <h1 class="text-2xl md:text-3xl font-bold text-green-800 mb-6">Carrito de Compras</h1>
        
        <!-- Carrito con productos -->
        <div id="carritoConProductos">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Lista de productos -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <div class="p-4 bg-green-50 border-b border-green-200">
                            <h2 class="text-lg font-semibold text-green-800">Productos en tu carrito</h2>
                        </div>
                        <div id="listaCarrito" class="divide-y divide-gray-200">
                            <!-- Se genera con JavaScript -->
                        </div>
                        <div class="p-4 bg-gray-50 flex justify-between items-center">
                            <button 
                                onclick="vaciarTodoCarrito()" 
                                class="text-red-600 hover:text-red-700 font-semibold transition-colors focus:outline-none focus:underline"
                            >
                                Vaciar carrito
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Resumen -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow-md p-6 sticky top-24">
                        <h2 class="text-lg font-semibold text-green-800 mb-4">Resumen del pedido</h2>
                        <div class="space-y-2 mb-4">
                            <div class="flex justify-between text-gray-600">
                                <span>Subtotal</span>
                                <span id="subtotal">0</span>
                            </div>
                            <div class="border-t border-gray-200 pt-2 flex justify-between text-lg font-bold text-green-800">
                                <span>Total</span>
                                <span id="totalCarrito">0</span>
                            </div>
                        </div>
                        <a 
                            href="checkout.html" 
                            id="btnProcederCheckout"
                            class="block w-full text-center bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 mb-3"
                        >
                            Proceder al Pago
                        </a>
                        <a 
                            href="index.html" 
                            class="block w-full text-center bg-gray-200 text-gray-800 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400"
                        >
                            Seguir Comprando
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Carrito vacío -->
        <div id="carritoVacio" class="hidden text-center py-12">
            <div class="text-6xl mb-4">🛒</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Tu carrito está vacío</h2>
            <p class="text-gray-600 mb-6">Agrega algunos productos para comenzar tu compra</p>
            <a href="index.html" class="inline-block bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
                Ir al Catálogo
            </a>
        </div>
    </main>
    
    <!-- Footer -->
    <div id="footer"></div>
    
    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            generarNavbar();
            generarFooter();
            cargarCarrito();
        });
        
        // Cargar y mostrar carrito
        function cargarCarrito() {
            const carritoCompleto = obtenerCarritoCompleto();
            const listaCarrito = document.getElementById('listaCarrito');
            const carritoConProductos = document.getElementById('carritoConProductos');
            const carritoVacio = document.getElementById('carritoVacio');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('totalCarrito');
            const btnCheckout = document.getElementById('btnProcederCheckout');
            
            if (carritoCompleto.length === 0) {
                if (carritoConProductos) carritoConProductos.classList.add('hidden');
                if (carritoVacio) carritoVacio.classList.remove('hidden');
                return;
            }
            
            if (carritoConProductos) carritoConProductos.classList.remove('hidden');
            if (carritoVacio) carritoVacio.classList.add('hidden');
            
            // Limpiar lista
            if (listaCarrito) listaCarrito.innerHTML = '';
            
            // Renderizar productos
            carritoCompleto.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-4 flex flex-col sm:flex-row gap-4';
                
                itemDiv.innerHTML = `
                    <div class="w-full sm:w-24 h-24 flex-shrink-0">
                        <img 
                            src="${item.imagen}" 
                            alt="${item.nombre}"
                            class="w-full h-full object-cover rounded-lg"
                            onerror="this.src='https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=800&auto=format&fit=crop'"
                        >
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between mb-2">
                            <h3 class="font-semibold text-gray-800">${escapeHtml(item.nombre)}</h3>
                            <button 
                                onclick="quitarProducto(${item.id})" 
                                class="text-red-600 hover:text-red-700 transition-colors"
                                title="Eliminar producto"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">${item.categoria}</p>
                        <p class="text-green-700 font-semibold mb-3">${formatearCOP(item.precio)}</p>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <button 
                                    onclick="cambiarCantidad(${item.id}, ${item.cantidad - 1})" 
                                    class="w-8 h-8 bg-gray-200 rounded-full hover:bg-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400"
                                    ${item.cantidad <= 1 ? 'disabled' : ''}
                                >
                                    -
                                </button>
                                <span class="w-12 text-center font-semibold">${item.cantidad}</span>
                                <button 
                                    onclick="cambiarCantidad(${item.id}, ${item.cantidad + 1})" 
                                    class="w-8 h-8 bg-gray-200 rounded-full hover:bg-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400"
                                    ${item.cantidad >= item.stock ? 'disabled' : ''}
                                >
                                    +
                                </button>
                            </div>
                            <p class="font-bold text-green-800">${formatearCOP(item.subtotal)}</p>
                        </div>
                        ${item.cantidad >= item.stock ? '<p class="text-xs text-orange-600 mt-1">Máximo disponible</p>' : ''}
                    </div>
                `;
                
                if (listaCarrito) listaCarrito.appendChild(itemDiv);
            });
            
            // Calcular totales
            const total = calcularTotalCarrito();
            if (subtotalEl) subtotalEl.textContent = formatearCOP(total);
            if (totalEl) totalEl.textContent = formatearCOP(total);
        }
        
        // Cambiar cantidad
        function cambiarCantidad(productoId, nuevaCantidad) {
            const resultado = actualizarCantidadCarrito(productoId, nuevaCantidad);
            if (resultado.success) {
                cargarCarrito();
                actualizarContadorCarrito();
            } else {
                mostrarToast(resultado.mensaje, 'error');
            }
        }
        
        // Quitar producto
        function quitarProducto(productoId) {
            const resultado = quitarDelCarrito(productoId);
            if (resultado.success) {
                cargarCarrito();
                actualizarContadorCarrito();
                mostrarToast('Producto eliminado del carrito', 'success');
            }
        }
        
        // Vaciar carrito
        function vaciarTodoCarrito() {
            if (confirm('¿Estás seguro de que deseas vaciar el carrito?')) {
                vaciarCarrito();
                cargarCarrito();
                actualizarContadorCarrito();
                mostrarToast('Carrito vaciado', 'success');
            }
        }
        
        // Escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
