<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Plantas - Inicio</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div id="navbar"></div>
    
    <!-- Contenido Principal -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="bg-gradient-to-r from-green-700 to-green-600 text-white py-12 md:py-20">
            <div class="container mx-auto px-4">
                <div class="max-w-3xl">
                    <h1 class="text-3xl md:text-5xl font-bold mb-4">Bienvenido a tu Tienda de Plantas</h1>
                    <p class="text-lg md:text-xl mb-6 text-green-100">Encuentra semillas, plantas ya crecidas, materas y abono para tu huerta y jardín. Todo lo que necesitas para cultivar vida.</p>
                    <a href="#catalogo" class="inline-block bg-amber-100 text-green-800 px-6 py-3 rounded-lg font-semibold hover:bg-amber-200 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-300">
                        Ver Catálogo
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Categorías Destacadas -->
        <section class="py-10">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl md:text-3xl font-bold text-green-800 mb-6 text-center">Categorías Destacadas</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="filtrarPorCategoria('Semillas')" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow border-2 border-transparent hover:border-green-500 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <div class="text-3xl mb-2">🌱</div>
                        <div class="font-semibold text-green-800">Semillas</div>
                    </button>
                    <button onclick="filtrarPorCategoria('Plantas')" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow border-2 border-transparent hover:border-green-500 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <div class="text-3xl mb-2">🌿</div>
                        <div class="font-semibold text-green-800">Plantas</div>
                    </button>
                    <button onclick="filtrarPorCategoria('Materas')" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow border-2 border-transparent hover:border-green-500 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <div class="text-3xl mb-2">🏺</div>
                        <div class="font-semibold text-green-800">Materas</div>
                    </button>
                    <button onclick="filtrarPorCategoria('Abono')" class="bg-white p-4 rounded-lg shadow-md hover:shadow-lg transition-shadow border-2 border-transparent hover:border-green-500 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <div class="text-3xl mb-2">🌾</div>
                        <div class="font-semibold text-green-800">Abono</div>
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Catálogo -->
        <section id="catalogo" class="py-10 bg-white">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl md:text-3xl font-bold text-green-800 mb-6 text-center">Nuestro Catálogo</h2>
                
                <!-- Filtros y Búsqueda -->
                <div class="bg-amber-50 p-4 rounded-lg mb-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Buscador -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Buscar por nombre</label>
                            <input 
                                type="text" 
                                id="buscador" 
                                placeholder="Ej: Monstera, Tomate..."
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                            >
                        </div>
                        
                        <!-- Filtro por categoría -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                            <select 
                                id="filtroCategoria" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                            >
                                <option value="Todas">Todas las categorías</option>
                                <option value="Semillas">Semillas</option>
                                <option value="Plantas">Plantas</option>
                                <option value="Materas">Materas</option>
                                <option value="Abono">Abono</option>
                            </select>
                        </div>
                        
                        <!-- Orden por precio -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ordenar por precio</label>
                            <select 
                                id="ordenPrecio" 
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                            >
                                <option value="sin-orden">Sin orden</option>
                                <option value="menor-mayor">Menor a Mayor</option>
                                <option value="mayor-menor">Mayor a Menor</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Grid de productos -->
                <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Los productos se generan con JavaScript -->
                </div>
                
                <!-- Mensaje sin resultados -->
                <div id="sinResultados" class="text-center py-8 hidden">
                    <p class="text-gray-600 text-lg">No se encontraron productos con los filtros aplicados</p>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer -->
    <div id="footer"></div>
    
    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/common.js"></script>
    <script src="js/catalogo.js"></script>
    <script>
        // Inicializar página
        document.addEventListener('DOMContentLoaded', function() {
            generarNavbar();
            generarFooter();
            inicializarCatalogo();
        });
        
        // Función para filtrar desde botones de categoría
        function filtrarPorCategoria(categoria) {
            document.getElementById('filtroCategoria').value = categoria;
            if (typeof aplicarFiltros === 'function') {
                aplicarFiltros();
            }
            // Scroll al catálogo
            document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
