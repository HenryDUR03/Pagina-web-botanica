<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Exitosa - Tienda de Plantas</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div id="navbar"></div>
    
    <!-- Contenido Principal -->
    <main class="flex-grow container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <!-- Mensaje de éxito -->
            <div class="bg-white rounded-lg shadow-lg p-8 text-center mb-6">
                <div class="text-6xl mb-4">✅</div>
                <h1 class="text-2xl md:text-3xl font-bold text-green-800 mb-4">¡Compra Exitosa!</h1>
                <p class="text-gray-600 mb-6">Gracias por tu compra. Tu pedido ha sido recibido correctamente.</p>
                
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                    <p class="text-sm text-gray-600 mb-2">Número de Pedido</p>
                    <p class="text-2xl font-bold text-green-800" id="numeroPedido">-</p>
                </div>
                
                <p class="text-gray-600 mb-6">
                    Recibirás un correo de confirmación con los detalles de tu envío.
                </p>
                
                <div class="space-y-3">
                    <a 
                        href="index.html" 
                        class="block w-full bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500"
                    >
                        Volver al Catálogo
                    </a>
                    <a 
                        href="index.html" 
                        class="block w-full bg-gray-200 text-gray-800 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400"
                    >
                        Seguir Comprando
                    </a>
                </div>
            </div>
            
            <!-- Resumen del pedido -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-lg font-semibold text-green-800 mb-4">Resumen de tu Pedido</h2>
                <div class="space-y-2">
                    <div class="flex justify-between text-gray-600">
                        <span>Cliente:</span>
                        <span id="nombreCliente">-</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Correo:</span>
                        <span id="correoCliente">-</span>
                    </div>
                    <div class="border-t border-gray-200 pt-2 flex justify-between text-lg font-bold text-green-800">
                        <span>Total:</span>
                        <span id="totalPedido">-</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <div id="footer"></div>
    
    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            generarNavbar();
            generarFooter();
            mostrarConfirmacion();
            // Asegurar que el carrito esté vacío (requerido)
            vaciarCarrito();
            actualizarContadorCarrito();
        });
        
        function mostrarConfirmacion() {
            // Obtener número de pedido de la URL
            const params = new URLSearchParams(window.location.search);
            const numeroPedido = params.get('pedido');
            
            if (numeroPedido) {
                document.getElementById('numeroPedido').textContent = numeroPedido;
            }
            
            // Obtener información del pedido guardada
            try {
                const infoPedido = localStorage.getItem('ultimo_pedido');
                if (infoPedido) {
                    const pedido = JSON.parse(infoPedido);
                    document.getElementById('nombreCliente').textContent = pedido.nombre || '-';
                    document.getElementById('correoCliente').textContent = pedido.correo || '-';
                    document.getElementById('totalPedido').textContent = formatearCOP(pedido.total || 0);
                    
                    // Limpiar la información después de mostrarla
                    localStorage.removeItem('ultimo_pedido');
                }
            } catch (error) {
                console.error('Error al obtener información del pedido:', error);
            }
        }
    </script>
</body>
</html>
